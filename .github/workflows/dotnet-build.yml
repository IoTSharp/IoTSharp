name: CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check out the JsonDB dependency
        run: git submodule update --init IoTSharp.Data.JsonDB
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build the backend and run basic tests
        run: >-
          dotnet test IoTSharp.Test/IoTSharp.Test.csproj --configuration Release
          -p:StaticWebAssetsEnabled=false -p:ShouldRunNpmInstall=false
          -p:ShouldRunBuildScript=false -p:GeneratePackageOnBuild=false
          --filter 'FullyQualifiedName~ApiContractTests|FullyQualifiedName~ConfigurationLeaseMigrationTests|FullyQualifiedName~ConfigurationOperationLeaseTests|FullyQualifiedName~EdgeContractSerializationTests|FullyQualifiedName~MqttRoutingTests|FullyQualifiedName~TestProfileContractTests'
      - name: Test IoTSharp.Data.JsonDB
        run: dotnet test IoTSharp.Data.JsonDB/tests/IoTSharp.Data.JsonDB.Tests/IoTSharp.Data.JsonDB.Tests.csproj --configuration Release
